<script src="js/main.js"></script>
<script>
  let notesData = [];
  let activeNoteId = null;
  let saveTimeout = null;

  function loadNotes() {
    const data = getUserData() || {};
    notesData = data.notes || [];
    renderNotesList();

    // Open note from URL ?id=xxx, or most recent, or create first one
    const params = new URLSearchParams(window.location.search);
    const urlId = params.get('id');
    if (urlId && notesData.find(n => n.id === urlId)) {
      openNote(urlId);
    } else if (notesData.length > 0) {
      openNote(notesData[notesData.length - 1].id);
    } else {
      createNewNote();
    }
  }

  function renderNotesList(filter = '') {
    const container = document.getElementById('notes-list-container');
    const filtered = notesData
      .filter(n => n.title.toLowerCase().includes(filter.toLowerCase()) || n.body.toLowerCase().includes(filter.toLowerCase()))
      .slice()
      .reverse();

    if (filtered.length === 0) {
      container.innerHTML = `<p style="font-size:0.8rem;color:var(--txt-muted);text-align:center;padding:2rem 0">No notes found</p>`;
      return;
    }

    container.innerHTML = filtered.map(n => `
      <div class="note-list-item ${n.id === activeNoteId ? 'active' : ''}" data-note-id="${n.id}">
        <div class="note-list-item-title">${n.icon || '📘'} ${escapeHtml2(n.title || 'Untitled')}</div>
        <div class="note-list-item-preview">${escapeHtml2((n.body || '').slice(0, 80) || 'No content yet')}</div>
      </div>
    `).join('');

    container.querySelectorAll('.note-list-item').forEach(item => {
      item.addEventListener('click', () => openNote(item.dataset.noteId));
    });
  }

  function openNote(id) {
    const note = notesData.find(n => n.id === id);
    if (!note) return;
    activeNoteId = id;
    document.getElementById('note-title-input').value = note.title;
    document.getElementById('note-body-input').value = note.body;
    document.getElementById('note-meta-time').textContent = `Last edited ${timeAgo2(note.updatedAt)}`;
    renderNotesList(document.getElementById('note-search').value);
  }

  function createNewNote() {
    const newNote = {
      id: 'n' + Date.now(),
      title: 'Untitled Note',
      body: '',
      icon: '📘',
      updatedAt: new Date().toISOString(),
    };
    notesData.push(newNote);
    persistNotes();
    openNote(newNote.id);
    document.getElementById('note-title-input').focus();
    toast('📝 New note created', 'success', 1500);
  }

  function deleteCurrentNote() {
    if (!activeNoteId) return;
    notesData = notesData.filter(n => n.id !== activeNoteId);
    persistNotes();
    toast('🗑️ Note deleted', 'error', 1500);
    if (notesData.length > 0) {
      openNote(notesData[notesData.length - 1].id);
    } else {
      createNewNote();
    }
  }

  function persistNotes() {
    const data = getUserData() || {};
    data.notes = notesData;
    saveUserData(data);
    renderNotesList(document.getElementById('note-search').value);
  }

  function autoSave() {
    if (!activeNoteId) return;
    const note = notesData.find(n => n.id === activeNoteId);
    if (!note) return;
    note.title = document.getElementById('note-title-input').value || 'Untitled Note';
    note.body  = document.getElementById('note-body-input').value;
    note.updatedAt = new Date().toISOString();
    persistNotes();
    document.getElementById('note-meta-time').textContent = 'Saved just now';
  }

  document.getElementById('note-title-input').addEventListener('input', () => {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(autoSave, 600);
  });
  document.getElementById('note-body-input').addEventListener('input', () => {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(autoSave, 600);
  });
  document.getElementById('note-search').addEventListener('input', (e) => renderNotesList(e.target.value));

  document.querySelectorAll('.toolbar-btn').forEach(btn => {
    btn.addEventListener('click', () => btn.classList.toggle('active'));
  });

  function escapeHtml2(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function timeAgo2(isoString) {
    if (!isoString) return 'never';
    const diff = Date.now() - new Date(isoString).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    return `${Math.floor(hrs / 24)}d ago`;
  }

  loadNotes();
</script>
